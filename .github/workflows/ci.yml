name: Offline contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      ASOUL_APP_DATA: ${{ github.workspace }}/build/ci-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/offline_test.py
      - run: python tools/check_architecture.py
      - run: python tools/scan_public.py
      - run: python -m compileall -q asoul_support desktop scripts
      - name: Package import
        run: python -m pip install . --no-deps
      - name: Installed command
        run: asoul-heartbeat --help
      - name: Windows desktop dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-desktop.txt
      - name: Windows real widget smoke
        if: runner.os == 'Windows'
        run: python tools/desktop_smoke.py
