<script>
window.__errs = [];
window.addEventListener("error", function (event) {
  window.__errs.push(String(event.message) + " @ " + String(event.filename || "").split("/").pop() + ":" + event.lineno);
  window.__errs = window.__errs.slice(-20);
});
window.addEventListener("unhandledrejection", function (event) {
  window.__errs.push("rejection: " + String((event.reason && event.reason.message) || event.reason));
});
</script>
